name: Update stocking data

on:
  schedule:
    # GitHub often starts scheduled runs late (seen 3-6 hours) or skips them, so there are several.
    # Times are UTC; Eastern is 5 hours behind in winter (EST) and 4 in summer (EDT).
    - cron: '7 11 * * *'    # morning: 6:07 am EST / 7:07 am EDT, picks up anything posted late the day before
    - cron: '37 17 * * *'   # 12:37 pm EST / 1:37 pm EDT (NC Wildlife posts after noon)
    - cron: '37 19 * * *'   #  2:37 pm EST / 3:37 pm EDT
    - cron: '37 21 * * *'   #  4:37 pm EST / 5:37 pm EDT, catches later postings
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: stocking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Start from the newest saved data
        run: git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pdftotext
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Read NC Wildlife stocking pages
        id: run
        run: node scripts/update-stocking.mjs
        continue-on-error: true

      - name: Save stocking.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898741+github-actions[bot]@users.noreply.github.com"
          git add stocking.json
          git diff --cached --quiet || git commit -m "Stocking data $(date -u +%Y-%m-%d)"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Report a failed source
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::One or more NC Wildlife sources could not be read. The previous data was kept. See the 'status' section of stocking.json."
          exit 1
